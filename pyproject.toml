[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-agent"
version = "0.1.0"
description = "Claude-powered agent that manages Kalshi positions within hard, code-enforced risk limits."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "httpx>=0.27",
    "cryptography>=41",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
kalshi-agent = "kalshi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
